<style>

<script type="text/babel">

  { text: "[ OK ] Connecting...", cls: "boot-line ok" },

const aboutParagraphs = [
  "Backend Software Engineer with 3+ years of production experience building and owning distributed backend systems across government, education, and enterprise domains. Designed event-driven architectures for platforms serving 1000+ users, delivering 20–30% performance gains through query optimization and caching.",
  "Known for translating ambiguous client requirements into well-scoped technical solutions, leading code reviews that raised team-wide quality standards, and mentoring junior engineers to independently own features. Seeking roles where backend architecture decisions have real product impact.",
];

const metrics = [
  { value: 3, suffix: "+", label: "years production" },
  { value: 8, suffix: "+", label: "projects shipped" },
  { value: 30, suffix: "%", label: "avg query gains" },
];

const sequence = [
  { id: "intro", command: "whoami", type: "intro" },
  { id: "about", command: "cat about.txt", type: "paragraph" },
  { id: "experience", command: "cat experience.log", type: "experience" },
  { id: "stack", command: "pip list --stack", type: "stack" },
  { id: "resume", command: "ls -la resume/", type: "resume" },
  { id: "projects", command: "ls projects/", type: "projects" },
  { id: "certs", command: "cat certifications.log", type: "certs" },
  { id: "education", command: "cat education.txt", type: "education" },
  { id: "contact", command: "cat contact.txt", type: "contact" },
];

const PAUSE_MS = 420;
const STAGGER_MS = 40;
const BOOT_DELAY = 340;
const INSTANT_AFTER = 1; // only animate first N queue steps

function TypedCommand({ text, speed = 240, onDone }) {
  const [value, setValue] = useState("");
  const onDoneRef = useRef(onDone);
  const indexRef = useRef(0);
  const timerRef = useRef(null);
  onDoneRef.current = onDone;

  useEffect(() => {
    indexRef.current = 0;
    setValue("");
  }, [text]);

  useEffect(() => {
    const flush = () => {
      if (timerRef.current) {
        clearTimeout(timerRef.current);
        timerRef.current = null;
      }
    };

    const scheduleTick = () => {
      const jitter = Math.round(Math.random() * 120 - 40);
      const delay = Math.max(140, speed + jitter);
      timerRef.current = setTimeout(tick, delay);
    };

    const tick = () => {
      indexRef.current += 1;
      setValue(text.slice(0, indexRef.current));
      if (indexRef.current >= text.length) {
        flush();
        onDoneRef.current?.();
      } else {
        scheduleTick();
      }
    };

    flush();
    scheduleTick();
    return flush;
  }, [text, speed]);

  return (
    <div className="line prompt">
      <span className="path">sajan@portfolio</span>
      <span className="sym">:~$</span> {value}
      <span className="cursor" />
    </div>
  );
}

function Typewriter({ text, speed = 62, onDone }) {
  const [output, setOutput] = useState("");
  const onDoneRef = useRef(onDone);
  onDoneRef.current = onDone;

  useEffect(() => {
    let i = 0;
    setOutput("");
    const timer = setInterval(() => {
      i++;
      setOutput(text.slice(0, i));
      if (i >= text.length) {
        clearInterval(timer);
        onDoneRef.current?.();
      }
    }, speed);
    return () => clearInterval(timer);
  }, [text, speed]);

  return <span>{output}</span>;
}

function CountUp({ value, suffix = "", duration = 1200, onDone }) {
  const [count, setCount] = useState(0);
  const onDoneRef = useRef(onDone);
  onDoneRef.current = onDone;

  useEffect(() => {
    const start = performance.now();
    let frame;
    const tick = (now) => {
      const progress = Math.min((now - start) / duration, 1);
      setCount(Math.round(progress * value));
      if (progress < 1) frame = requestAnimationFrame(tick);
      else onDoneRef.current?.();
    };
    frame = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frame);
  }, [value, duration]);

  return <span>{count}{suffix}</span>;
}

function useStaggerReveal(count, delay = STAGGER_MS, onComplete, enabled = true) {
  const [visible, setVisible] = useState(enabled ? 0 : count);
  const onCompleteRef = useRef(onComplete);
  onCompleteRef.current = onComplete;

  useEffect(() => {
    if (!enabled) {
      setVisible(count);
      return;
    }
    if (visible >= count) {
      onCompleteRef.current?.();
      return;
    }
    const t = setTimeout(() => setVisible((v) => v + 1), delay);
    return () => clearTimeout(t);
  }, [visible, count, delay, enabled]);

  return enabled ? visible : count;
}

const IO_OPTIONS = { threshold: 0.15, rootMargin: "0px 0px -12% 0px" };

function prefersReducedMotion() {
  return typeof window !== "undefined" &&
    window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

// Fires once, the first time the referenced element scrolls into view.
function useInViewOnce(ref) {
  const [inView, setInView] = useState(false);

  useEffect(() => {
    if (inView) return;
    const node = ref.current;
    if (!node) return;
    if (typeof IntersectionObserver === "undefined") { setInView(true); return; }

    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) {
        setInView(true);
        io.disconnect();
      }
    }, IO_OPTIONS);

    io.observe(node);
    return () => io.disconnect();
  }, [ref, inView]);

  return inView;
}

// Renders a section that stays dormant (dimmed empty prompt) until the user
// scrolls it into view, at which point it types its command and reveals its
// content — the "typing on scroll" effect for everything after the intro.
function ScrollStep({ step, startDelay = 0, ready = true, onComplete }) {
  const sectionRef = useRef(null);
  const inView = useInViewOnce(sectionRef);
  const reduced = useRef(prefersReducedMotion()).current;
  const [phase, setPhase] = useState("waiting"); // waiting -> typing -> content
  const [readyToType, setReadyToType] = useState(false);
  const [hasScrolled, setHasScrolled] = useState(false);

  useEffect(() => {
    if (!inView || phase !== "waiting" || !ready) return;
    if (reduced) {
      setPhase("typing");
      return;
    }

    const scrollHeight = document.documentElement.scrollHeight;
    const atBottom = window.scrollY + window.innerHeight >= scrollHeight - 32;
    const pageIsFilled = scrollHeight > window.innerHeight + 8;

    if (pageIsFilled && atBottom && !hasScrolled) {
      setReadyToType(false);
      return;
    }

    setReadyToType(true);
  }, [inView, phase, reduced, ready, hasScrolled]);

  useEffect(() => {
    if (!readyToType || phase !== "waiting") return;
    const t = setTimeout(() => setPhase("typing"), startDelay);
    return () => clearTimeout(t);
  }, [readyToType, phase, startDelay]);

  useEffect(() => {
    if (phase !== "waiting") return;
    const onScroll = () => setHasScrolled(true);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [phase]);

  const advance = useCallback(() => {
    setTimeout(() => setPhase("content"), PAUSE_MS);
  }, []);

  return (
    <section id={step.id} ref={sectionRef} className={step.id === "contact" ? "contact" : ""}>
      {phase === "waiting" && (
        <div className="line prompt waiting">
          <span className="path">sajan@portfolio</span><span className="sym">:~$</span> <span className="cursor" />
        </div>
      )}
      {phase === "typing" && <TypedCommand text={step.command} onDone={advance} />}
      {phase === "content" && (
        <>
          <PromptLine cmd={step.command} />
          <SectionContent step={step} animated={!reduced} onDone={onComplete} />
        </>
      )}
    </section>
  );
}

function BootSequence({ onComplete, onSkip }) {
  const [lineIndex, setLineIndex] = useState(0);
  const doneRef = useRef(false);

  const finish = useCallback(() => {
    if (doneRef.current) return;
    doneRef.current = true;
    onComplete();
  }, [onComplete]);

  useEffect(() => {
    if (lineIndex >= BOOT_LINES.length) {
      const t = setTimeout(finish, 120);
      return () => clearTimeout(t);
    }
    const delay = BOOT_LINES[lineIndex].text === "" ? 40 : BOOT_DELAY;
    const t = setTimeout(() => setLineIndex((i) => i + 1), delay);
    return () => clearTimeout(t);
  }, [lineIndex, finish]);

  return (
    <div className="boot">
      {BOOT_LINES.slice(0, lineIndex).map((line, i) => (
        <div className={"line " + line.cls} key={i}>{line.text || "\u00A0"}</div>
      ))}
      {lineIndex >= BOOT_LINES.length && (
        <div className="line launch animate-in">Launching portfolio...</div>
      )}
      <button type="button" className="skip-btn" onClick={onSkip}>skip intro →</button>
    </div>
  );
}

function PromptLine({ cmd }) {
  return (
    <div className="line prompt">
      <span className="path">sajan@portfolio</span><span className="sym">:~$</span> {cmd}
    </div>
  );
}

    ],

function ActiveStep({ step, onComplete, stepIndex }) {
  const animate = stepIndex < INSTANT_AFTER;
  const [phase, setPhase] = useState("typing");
  const onCompleteRef = useRef(onComplete);
  onCompleteRef.current = onComplete;

  const advance = useCallback(() => {
    setTimeout(() => setPhase("widget"), PAUSE_MS);
  }, []);

  const handleWidgetDone = useCallback(() => {
    setTimeout(() => onCompleteRef.current(), 150);
  }, []);

  if (phase === "typing") {
    return <TypedCommand text={step.command} onDone={advance} />;
  }

  return (
    <section id={step.id}>
      <PromptLine cmd={step.command} />
      <SectionContent step={step} animated={animate} onDone={handleWidgetDone} />
    </section>
  );
}

function InteractiveConsole({ refs }) {
  const [logEntries, setLogEntries] = useState([]);
  const [input, setInput] = useState("");
  const skipAutoScroll = useRef(false);
  const navCommands = useRef(new Set(["about", "experience", "stack", "projects", "certs", "education", "contact"]));

  const scrollTo = (key, label) => {
    if (refs[key] && refs[key].current) {
      refs[key].current.scrollIntoView({ behavior: "smooth" });
    }
    return label;
  };

  const commands = {
    help: () => "available commands: about, experience, stack, projects, certs, education, resume, contact, clear, cat about.txt, one, eat",
    about: () => scrollTo("about", "jumping to about.txt"),
    experience: () => scrollTo("experience", "jumping to experience.log"),
    stack: () => scrollTo("stack", "jumping to tech stack"),
    projects: () => scrollTo("projects", "jumping to projects/"),
    certs: () => scrollTo("certs", "jumping to certifications.log"),
    education: () => scrollTo("education", "jumping to education.txt"),
    resume: () => { window.location.href = "resume.pdf"; return "downloading resume.pdf ..."; },
    contact: () => scrollTo("contact", "jumping to contact.txt"),
    whoami: () => "sajan",
    ls: () => "about  experience  stack  projects  certs  education  resume  contact",
    clear: () => { setLogEntries([]); return null; },
    "cat about.txt": () => ({ lines: aboutParagraphs, delay: 420 }),
    one: () => ({ lines: ["one is printing...", "one finished printing output."], next: "eat", delay: 520 }),
    eat: () => "eat command executed after one.",
  };

  const printCommentLines = (lines, delay = 420, onComplete) => {
    const printLine = (index) => {
      if (index >= lines.length) {
        onComplete?.();
        return;
      }
      setLogEntries((prev) => [...prev, { text: lines[index], cls: "comment" }]);
      setTimeout(() => printLine(index + 1), delay);
    };
    printLine(0);
  };

  const runConsoleCommand = (cmd, auto = false) => {
    const raw = cmd.trim();
    if (!raw) return;
    const lower = raw.toLowerCase();
    const command = commands[lower];

    setLogEntries((prev) => [...prev, { text: "sajan@portfolio:~$ " + raw, cls: "prompt" }]);

    if (!command) {
      setLogEntries((prev) => [...prev, { text: `command not found: ${raw}. type 'help'`, cls: "comment" }]);
      return;
    }

    const result = command();
    const scheduleNext = (next) => {
      if (next) {
        setTimeout(() => runConsoleCommand(next, true), 180);
      }
    };

    if (typeof result === "string") {
      setLogEntries((prev) => [...prev, { text: result, cls: "comment" }]);
      return;
    }

    if (Array.isArray(result)) {
      printCommentLines(result, 120, () => scheduleNext(null));
      return;
    }

    if (result && typeof result === "object") {
      const lines = result.lines ?? (result.text ? [result.text] : []);
      const delay = result.delay ?? 120;

      if (lines.length) {
        printCommentLines(lines, delay, () => scheduleNext(result.next));
        return;
      }

      if (result.text) {
        setLogEntries((prev) => [...prev, { text: result.text, cls: "comment" }]);
      }

      scheduleNext(result.next);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key !== "Enter") return;
    const raw = input.trim();
    if (!raw) return;
    if (navCommands.current.has(raw.toLowerCase())) {
      skipAutoScroll.current = true;
    }
    runConsoleCommand(raw);
    setInput("");
  };

  useEffect(() => {
    if (skipAutoScroll.current) {
      skipAutoScroll.current = false;
      return;
    }
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" });
  }, [logEntries]);

  return (
    <section id="console" className="console">
      <div id="log">
        {logEntries.map((e, i) => <div className={"line " + e.cls} key={i}>{e.text}</div>)}
      </div>
      <div className="inputline">
        <span className="prompt"><span className="path">sajan@portfolio</span><span className="sym">:~$</span></span>
        <input
          type="text"
          autoComplete="off"
          spellCheck="false"
          placeholder="type 'help'"
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={handleKeyDown}
        />
        <span className="cursor"></span>
      </div>
      <div className="hint">try: help, about, experience, stack, projects, certs, education, resume, contact, clear</div>
    </section>
  );
}

  const introStep = sequence[0];

  useEffect(() => {

    const onKey = (e) => {

  }, [introDone, skipAll]);

  return (
    <div className="crt">
      <div className="titlebar">
        <span className="dot red"></span>
        <span className="dot yellow"></span>
        <span className="dot green"></span>

        {!bootComplete && (
          <BootSequence onComplete={() => setBootComplete(true)} onSkip={skipAll} />
        )}

          <div ref={refs.intro}>

        )}

        )}

        {/* Everything after the intro sits dormant until it's scrolled into
            view, then types itself out — scroll down to trigger each section. */}
        {bootComplete && introDone && restSteps.map((step, idx) => {
          const previousStep = idx === 0 ? "intro" : restSteps[idx - 1].id;
          return (
            <div key={step.id} ref={refs[step.id]}>
              <ScrollStep
                step={step}
                startDelay={idx * 140}
                ready={completed[previousStep]}
                onComplete={() => markStepComplete(step.id)}
              />
            </div>
          );
        })}

        {bootComplete && introDone && <InteractiveConsole refs={refs} />}
      </div>
    </div>
  );
}

(function startMatrix() {
  const canvas = document.getElementById("matrix-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const letters = "0123456789".split("");
  let fontSize = 14;
  const columns = [];

  const resize = () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    fontSize = Math.max(12, Math.min(20, window.innerWidth / 80));
    const cols = Math.floor(canvas.width / fontSize);
    columns.length = cols;
    for (let i = 0; i < cols; i++) {
      columns[i] = columns[i] || 1;
    }
  };

  const draw = () => {
    ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(122, 186, 255, 0.4)";
    ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;
    columns.forEach((y, index) => {
      const text = letters[Math.floor(Math.random() * letters.length)];
      const x = index * fontSize;
      ctx.fillText(text, x, y * fontSize);
      if (y * fontSize > canvas.height && Math.random() > 0.975) {
        columns[index] = 0;
      }
      columns[index]++;
    });
    requestAnimationFrame(draw);
  };

  window.addEventListener("resize", resize);
  resize();
  draw();
})();
